# Runs the open-source Headwind MDM server and its PostgreSQL database on this computer.
# Start:  docker compose up -d      Stop:  docker compose down
# The server is published on 127.0.0.1 only. Android emulators reach it at http://10.0.2.2:8080.
# Default admin login is admin / admin. Change it in the admin panel after the first sign-in.
services:
  postgres:
    image: postgres:12-alpine
    environment:
      POSTGRES_USER: hmdm
      POSTGRES_PASSWORD: ${SQL_PASS:-change-me-db}
      POSTGRES_DB: hmdm
    volumes:
      - hmdm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmdm -d hmdm"]
      interval: 5s
      retries: 30

  hmdm:
    image: ${HMDM_IMAGE:-headwindmdm/hmdm:0.1.9}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQL_HOST: postgres
      SQL_BASE: hmdm
      SQL_USER: hmdm
      SQL_PASS: ${SQL_PASS:-change-me-db}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      PROTOCOL: http
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      SHARED_SECRET: ${SHARED_SECRET:-change-me-secret}
      HMDM_VARIANT: os
      CLIENT_VERSION: "6.40"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  hmdm-db:
